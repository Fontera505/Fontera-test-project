<!DOCTYPE html>
<head>
  <title>Exersice</title>
  <style>
    .square{
      background-color: red;
      width: 100px;
      height: 100px;
      display:inline-block;
    }
    .circle{
      background-color: green;
      width: 100px;
      height: 100px;
      border-radius: 50px;
    }
    .picture{
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 30px;
      vertical-align: middle;
      margin-right: 10px;
    }
    .textbox{
      font-size: 18px;
      border: none;
      width: 300px;
      vertical-align: middle;
    }
    .profile{
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
      padding-top: 12px;
      padding-bottom: 12px;
      padding-left: 12px;
      padding-right: 12px;
      width: 450px;
      border-radius: 6px;
    }
    .button{
      background-color: rgb(29, 155, 240);
      color: white;
      border: none;
      padding-top: 8px;
      padding-bottom: 8px;
      padding-left: 16px;
      padding-right: 16px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      vertical-align: middle;
    }
  </style>
</head>
<body>
    <div class="square"></div>
    <div class="circle"></div>
    <div class="profile">
      <img class="picture" src="image/Profile_1.png">
      <input class="textbox" type="text" placeholder="Hello World">
      <button class="button">Tweet</button>
    </div>
</body>
</html>
